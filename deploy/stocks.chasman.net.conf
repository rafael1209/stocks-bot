# stocks.chasman.net – trading bot dashboard. Same pattern as game.chasman.net:
# Cloudflare proxies the domain, the origin uses the Cloudflare Origin Certificate
# (*.chasman.net) in /etc/nginx/conf.d/certs/.
#
# Access is protected by the dashboard's own PIN login (see auth.py / set_pin.py):
# every data endpoint answers 401 without a valid session cookie.
server {
    listen 80;
    server_name stocks.chasman.net;

    location /.well-known/acme-challenge/ {
        root /srv/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stocks.chasman.net;

    ssl_certificate     /etc/nginx/conf.d/certs/cert.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/privkey.pem;

    charset utf-8;

    location / {
        # resolve the container name at request time – a rebuild does not 502 until a reload
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stocks_backend stocks-web;
        proxy_pass http://$stocks_backend:8787$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
